    <title>Doppio — просто попробуй</title>

<body>

<header class="hero">
    <h1 class="visually-hidden">Doppio — кофейня на Замковой, 12а</h1>
    <div class="hero-photo" role="img" aria-label="Интерьер кофейни Doppio"></div>

    <div class="hero-info">
        <div class="hero-info-inner">
            <div class="coffee-info">
                <p>
                    <span class="info-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"/><circle cx="12" cy="9" r="2.2"/></svg>
                    </span>
                   <a href="https://www.google.com/maps/search/?api=1&query=ул.%20Замковая%2012а%2C%20Гродно%2C%20Беларусь"
   target="_blank"
   rel="noopener noreferrer">
    ул. Замковая 12а
</a>
                </p>
                <p>
                    <span class="info-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle class="fill-dot" cx="17.2" cy="6.8" r="1"/></svg>
                    </span>
                     <a href="https://www.instagram.com/doppio_grodno/"
   target="_blank"
   rel="noopener noreferrer">
    Inst/Tiktok:@doppio_grodno
</a>
                </p>
                <p>
                    <span class="info-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
                    </span>
                    <span>10:00 — 23:00 без выходных</span>
                </p>
            </div>
        </div>
    </div>
</header>


<a href="#seasonal-menu" class="seasonal-teaser">
    <span class="seasonal-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20.500C9 20.500 7.200 18.600 7.600 16.600 5.600 16 5 13.800 6.200 12.400 5 11 5.400 8.800 7.200 8.200 7.200 6 9.400 4.200 12 3c2.600 1.200 4.800 3 4.800 5.200 1.800.6 2.200 2.800 1 4.200 1.200 1.400.6 3.600-1.400 4.200.4 2-1.400 3.900-4.400 3.900ZM12 21V7M12 16l-2-1.500M12 16l2-1.500M12 12l-2-1.500M12 12l2-1.500M12 20.500V23"/></svg></span>
    <span>
        <strong>СЕЗОННОЕ МЕНЮ</strong>
        <small>успей попробовать →</small>
    </span>
</a>


<main id="menu" class="menu">

    <!-- КОФЕ -->
    <section class="menu-category" id="coffee">
        <button class="menu-title" type="button" aria-expanded="false">
            <div class="category-image category-coffee"></div>
            <div class="category-info">
                <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9Zm11 1.5h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5c0 1.3 1 1.3 1 2.7M12 3.5c0 1.3 1 1.3 1 2.7"/></svg></span>
                <span class="category-name">КОФЕ</span>
                <span class="category-arrow" aria-hidden="true">→</span>
            </div>
        </button>
        <div class="menu-content"></div>
    </section>

    <!-- НЕ КОФЕ -->
    <section class="menu-category" id="non-coffee">
        <button class="menu-title" type="button" aria-expanded="false">
            <div class="category-image category-non-coffee"></div>
            <div class="category-info">
                <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5s6 6.2 6 10.5a6 6 0 0 1-12 0c0-4.3 6-10.5 6-10.5Z"/><path d="M9 14.5a3 3 0 0 0 3 3"/></svg></span>
                <span class="category-name">НЕ КОФЕ</span>
                <span class="category-arrow" aria-hidden="true">→</span>
            </div>
        </button>
        <div class="menu-content"></div>
    </section>

    <!-- ЕДА -->
    <section class="menu-category" id="food">
        <button class="menu-title" type="button" aria-expanded="false">
            <div class="category-image category-food"></div>
            <div class="category-info">
                <span class="category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 12v9M17 21V3c-2.200 1.600-3 4-3 7 0 1.700 1 2.600 3 3"/></svg></span>
                <span class="category-name">ЕДА</span>
                <span class="category-arrow" aria-hidden="true">→</span>
            </div>
        </button>
        <div class="menu-content"></div>
    </section>

    <!-- ДЕСЕРТЫ -->
<section class="menu-category dessert-category">
    <div class="menu-title dessert-title">
        <div class="category-image category-dessert"></div>

        <div class="category-info">
            <span class="category-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M4 19h16M5 19v-7l14-4v11M5 12l14-4M9 6.500V4"/>
                </svg>
            </span>

            <span class="category-name">ДЕСЕРТЫ</span>

            <span class="dessert-note">Актуальное наличие на витрине</span>
        </div>
    </div>
</section>

</main>


<section id="seasonal-menu" class="seasonal-menu">
    <h2>ОСЕНЬ</h2>
    <div class="seasonal-ornament" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20.500C9 20.500 7.200 18.600 7.600 16.600 5.600 16 5 13.800 6.200 12.400 5 11 5.400 8.800 7.200 8.200 7.200 6 9.400 4.200 12 3c2.600 1.200 4.800 3 4.800 5.200 1.800.6 2.200 2.800 1 4.200 1.200 1.400.6 3.600-1.400 4.200.4 2-1.400 3.900-4.400 3.900ZM12 21V7M12 16l-2-1.500M12 16l2-1.500M12 12l-2-1.500M12 12l2-1.500M12 20.500V23"/></svg></div>
    <p class="seasonal-subtitle">уют в каждой чашке</p>
    

    <div class="seasonal-grid">
    <a class="seasonal-card" href="images/autumn-coffee.png" target="_blank" rel="noopener">
        <img src="images/autumn-coffee.png" alt="Осеннее меню: кофейные напитки" loading="lazy">
    </a>

    <a class="seasonal-card" href="images/autumn-noncoffee.png" target="_blank" rel="noopener">
        <img src="images/autumn-noncoffee.png" alt="Осеннее меню: напитки без кофе" loading="lazy">
    </a>
</div>
</section>


<footer>
    <p>Doppio</p>
    <span>Cпасибо, что выбираете нас!</span>
    <span class="footer-heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20s-7.500-4.600-7.500-10A4.200 4.200 0 0 1 12 7.600 4.200 4.200 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10Z"/></svg></span>
</footer>

    ↑ МЕНЮ
</button>
